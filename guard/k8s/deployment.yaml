apiVersion: apps/v1
kind: Deployment
metadata:
  name: guard
  labels:
    app.kubernetes.io/name: guard
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: guard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: guard
    spec:
      enableServiceLinks: false
      containers:
        - name: guard
          image: guard-proxy:local   # built locally, loaded with `make guard-load`
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - { name: UPSTREAM, value: "http://vllm.llm.svc:8000" }
            - { name: THRESHOLD, value: "0.5" }
          resources:
            requests: { cpu: "500m", memory: 1Gi }
            limits: { memory: 3Gi }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          volumeMounts:
            - { name: classifier, mountPath: /model, readOnly: true }
      volumes:
        - name: classifier
          hostPath: { path: /opt/models/guard, type: Directory }

# llm-d-router-gateway chart values for the real vLLM pods in namespace llm
router:
  modelServers:
    matchLabels:
      app.kubernetes.io/name: vllm
  epp:
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { memory: 512Mi }
provider:
  name: none
httpRoute:
  create: true
  inferenceGatewayName: inference-gateway
